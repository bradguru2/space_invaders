name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must look like v1.3.0 or v1.3.0-rc.1"
            exit 1
          fi

      - name: Build distribution
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew clean shadowDistZip -PreleaseVersion="$version" --console=plain

      - name: Prepare release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="space_invaders-shadow-${version}.zip"
          cd build/distributions
          sha256sum "$asset" > "${asset}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="build/distributions/space_invaders-shadow-${version}.zip"
          release_options=(--generate-notes --title "$GITHUB_REF_NAME" --verify-tag)
          if [[ "$version" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$asset" \
            "${asset}.sha256" \
            "${release_options[@]}"
